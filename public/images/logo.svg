<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <radialGradient id="winnitBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1c2420"/>
      <stop offset="100%" stop-color="#0a0d0b"/>
    </radialGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#BEF264"/>
    </linearGradient>
    <linearGradient id="centerPetal" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="20" cy="20" r="18" fill="url(#winnitBg)" stroke="#27272a" stroke-width="1"/>

  <!-- Stylized Growth Crown / Sprout -->
  <g filter="url(#glow)">
    <!-- Left Leaf -->
    <path d="M12 25 C12 18, 14 14, 15 12 C16 16, 17 21, 16 26 Z" fill="url(#sproutGrad)"/>
    <!-- Center Leaf -->
    <path d="M17.5 27 C18 17, 19.5 10, 20 8 C20.5 10, 22 17, 22.5 27 Z" fill="url(#sproutGrad)"/>
    <!-- Right Leaf -->
    <path d="M28 25 C28 18, 26 14, 25 12 C24 16, 23 21, 24 26 Z" fill="url(#sproutGrad)"/>
    <!-- Central Seed / Core Gem -->
    <polygon points="20,17 22,23 20,25 18,23" fill="#D9F99D" opacity="0.9"/>
  </g>
</svg>
